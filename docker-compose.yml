services:
  gp-verify-bot:
    image: python:3.12-slim
    container_name: gp-verify-bot
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - .env
    environment:
      - PIP_INDEX_URL=https://pypi.org/simple
      - PIP_DEFAULT_TIMEOUT=180
      - PIP_RETRIES=20
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app
      - ./requirements.txt:/app/requirements.txt:ro
      - ./data:/data
      - ./logs:/logs
    command: >
        sh -c "python -m pip install --upgrade pip --root-user-action=ignore &&
        python -m pip install --no-cache-dir --timeout 180 --retries 20 --root-user-action=ignore -r /app/requirements.txt &&
        python main.py"